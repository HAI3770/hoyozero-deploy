spring:
  profiles:
    active: mysql

hoyozero:
  runner-token: ${HOYOZERO_RUNNER_TOKEN:}
  workspace: ${HOYOZERO_WORKSPACE:/home/hoyozero-deploy}
  git-timeout: 300
  build-timeout: 600
  executor-pool-size: 5
  keep-workspace: false
  webhook:
    secret: ${HOYOZERO_WEBHOOK_SECRET:}
    callback-url: ""
    callback-secret: ""
  dify:
    base-url: ${DIFY_BASE_URL:}
    api-key: ${DIFY_API_KEY:}
    app-id: ${DIFY_APP_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
