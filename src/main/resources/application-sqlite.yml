spring:
  application:
    name: hoyozero-deploy
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 开发环境: 数据库文件将生成在 src/main/resources/db 目录下
    # 生产环境: 建议修改为绝对路径或外部目录
    url: jdbc:sqlite:src/main/resources/db/hoyozero_deploy.db
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
server:
  port: 8080

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # SQLite 使用 ASSIGN_ID (雪花算法) 替代 auto，避免 getGeneratedKeys 不支持的问题
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token配置
sa-token:
  token-name: Authorization
  timeout: 3600
  active-timeout: 3600
  is-concurrent: true
  is-share: true
  token-style: random-64
  is-log: false

# 应用配置
hoyozero:
  # 工作目录 (不设置则使用默认目录：Windows: D:\hoyozero-deploy, Linux: /home/hoyozero-deploy)
  workspace:
  # Git克隆超时时间（秒）
  git-timeout: 300
  # 构建超时时间（秒）
  build-timeout: 600
  # 线程池大小
  executor-pool-size: 5
  # 构建完成后是否保留工作目录 (true:保留, false:清理)
  keep-workspace: false
