services:
  mysql:
    image: mysql:8.0
    container_name: hoyozero-deploy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${HOYOZERO_DB_ROOT_PASSWORD:?HOYOZERO_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: hoyozero_deploy
    ports:
      - "3308:3306"
    volumes:
      - /data/hoyozero-deploy/mysql:/var/lib/mysql
      - ./doc/hoyozero_deploy.sql:/docker-entrypoint-initdb.d/01-hoyozero-deploy.sql:ro
    networks:
      - hoyozero-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoyozero-deploy-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hoyozero_deploy?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${HOYOZERO_DB_ROOT_PASSWORD:?HOYOZERO_DB_ROOT_PASSWORD is required}
      HOYOZERO_WORKSPACE: /app/workspace
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /data/hoyozero-deploy/workspace:/app/workspace
    networks:
      - hoyozero-network
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hoyozero-deploy-frontend
    restart: always
    ports:
      - "30080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hoyozero-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hoyozero-network:
    driver: bridge
